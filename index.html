<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지니 미니 스티커</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #ff6b81; }
        p { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>❤️ 지니 미니 스티커 ❤️</h1>
        <p>여자친구분을 위해 만들어진 예쁜 스티커 페이지입니다.</p>
        <p style="font-size: 24px;">✨ 🎀 🦄 ✨</p>
    </div>
</body>
</html>
